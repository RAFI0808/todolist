<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Todo List</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #5c67f2;
            --secondary-color: #4a5568;
            --danger-color: #ff6b6b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .todo-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .tasks-toggle-btn {
            background-color: var(--secondary-color);
            color: white;
            width: 100%;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Hidden class for the list toggle functionality */
        .hidden {
            display: none !important;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        li:last-child {
            border-bottom: none;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        .delete-btn:hover {
            background-color: #fff5f5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h1>My Tasks</h1>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
            <button class="add-btn" id="add-button">Add</button>
        </div>

        <!-- New toggle button below the add section -->
        <button class="tasks-toggle-btn" id="toggle-tasks-btn">
            My Tasks (<span id="task-count">0</span>) ▾
        </button>

        <!-- The list starts hidden -->
        <ul id="todo-list" class="hidden"></ul>
    </div>

    <script>
        // DOM Elements
        const todoInput = document.getElementById('todo-input');
        const addButton = document.getElementById('add-button');
        const toggleTasksBtn = document.getElementById('toggle-tasks-btn');
        const taskCountSpan = document.getElementById('task-count');
        const todoList = document.getElementById('todo-list');

        // Load tasks from LocalStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Initialize App
        function renderTasks() {
            todoList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');

                li.innerHTML = `
                    <span class="task-text" onclick="toggleTask(${index})">${task.text}</span>
                    <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
                `;
                todoList.appendChild(li);
            });
            
            // Update counter badge inside the button
            taskCountSpan.textContent = tasks.length;
            saveTasks();
        }

        // Add a new task
        function addTask() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            tasks.push({ text: taskText, completed: false });
            todoInput.value = '';
            renderTasks();
        }

        // Toggle visibility of the list
        function toggleListVisibility() {
            todoList.classList.toggle('hidden');
            
            // Change arrow direction indicator based on visibility state
            if (todoList.classList.contains('hidden')) {
                toggleTasksBtn.innerHTML = `My Tasks (<span id="task-count">${tasks.length}</span>) ▾`;
            } else {
                toggleTasksBtn.innerHTML = `My Tasks (<span id="task-count">${tasks.length}</span>) ▴`;
            }
            // Re-assign the span reference since innerHTML wipes it
            setTimeout(() => {
                const newSpan = document.getElementById('task-count');
                newSpan.textContent = tasks.length;
            }, 0);
        }

        // Toggle task completion
        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        // Delete a task
        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        };

        // Save to LocalStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Event Listeners
        addButton.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        toggleTasksBtn.addEventListener('click', toggleListVisibility);

        // Initial Render
        renderTasks();
    </script>
</body>
</html>
