<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Todo List</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #5c67f2;
            --secondary-color: #4a5568;
            --danger-color: #ff6b6b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .todo-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            position: relative;
            min-height: 320px;
            overflow: hidden;
        }

        /* Screen Wrapper for Sliding Animations */
        .screen-wrapper {
            display: flex;
            width: 200%; /* Holds two screens side-by-side */
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Individual Screens */
        .screen {
            width: 50%;
            padding: 0 5px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        /* Active Navigation States */
        .todo-container.show-tasks .screen-wrapper {
            transform: translateX(-50%); /* Slides forward to the tasks screen */
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .nav-btn {
            background-color: var(--secondary-color);
            color: white;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .back-btn {
            background-color: transparent;
            color: var(--secondary-color);
            padding: 0.5rem 0;
            margin-bottom: 1rem;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .back-btn:hover {
            color: var(--primary-color);
            background: none;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 250px;
            overflow-y: auto;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 0;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        li:last-child {
            border-bottom: none;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #fff5f5;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            margin-top: 2rem;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="todo-container" id="app-container">
        <div class="screen-wrapper">
            
            <!-- SCREEN 1: Input & Navigation -->
            <div class="screen">
                <h1>Create Task</h1>
                <div class="input-group">
                    <input type="text" id="todo-input" placeholder="What needs to be done?" autocomplete="off">
                    <button class="add-btn" id="add-button">Add</button>
                </div>
                <button class="nav-btn" id="go-to-tasks-btn">
                    My Tasks (<span id="task-count">0</span>) →
                </button>
            </div>

            <!-- SCREEN 2: Task List (Slides Forward) -->
            <div class="screen">
                <button class="back-btn" id="back-to-input-btn">← Back to Create</button>
                <h1>My Tasks</h1>
                <ul id="todo-list"></ul>
                <div id="empty-msg" class="empty-state">No tasks added yet!</div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const appContainer = document.getElementById('app-container');
        const todoInput = document.getElementById('todo-input');
        const addButton = document.getElementById('add-button');
        const goToTasksBtn = document.getElementById('go-to-tasks-btn');
        const backToInputBtn = document.getElementById('back-to-input-btn');
        const taskCountSpan = document.getElementById('task-count');
        const todoList = document.getElementById('todo-list');
        const emptyMsg = document.getElementById('empty-msg');

        // Load tasks from LocalStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Initialize and Update Interface
        function renderTasks() {
            todoList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyMsg.style.display = 'block';
            } else {
                emptyMsg.style.display = 'none';
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    if (task.completed) li.classList.add('completed');

                    li.innerHTML = `
                        <span class="task-text" onclick="toggleTask(${index})">${task.text}</span>
                        <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
                    `;
                    todoList.appendChild(li);
                });
            }
            
            // Update item counter on screen 1
            taskCountSpan.textContent = tasks.length;
            saveTasks();
        }

        // Add a new task
        function addTask() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            tasks.push({ text: taskText, completed: false });
            todoInput.value = '';
            renderTasks();
            
            // Optional: Uncomment the next line if you want it to auto-slide to the list immediately when adding a task
            // appContainer.classList.add('show-tasks');
        }

        // Toggle task completion
        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        // Delete a task
        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        };

        // Save to LocalStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Event Listeners for Navigation
        goToTasksBtn.addEventListener('click', () => {
            appContainer.classList.add('show-tasks');
        });

        backToInputBtn.addEventListener('click', () => {
            appContainer.classList.remove('show-tasks');
        });

        // Event Listeners for Input Action
        addButton.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });

        // Initial Render
        renderTasks();
    </script>
</body>
</html>
