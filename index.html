<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Todo List</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #5c67f2;
            --secondary-color: #4a5568;
            --danger-color: #ff6b6b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .todo-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary-color);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        button {
            border: none;
            padding: 0.8rem 1.2rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .add-btn {
            background-color: var(--primary-color);
            color: white;
        }

        .tasks-toggle-btn {
            background-color: var(--secondary-color);
            color: white;
            width: 100%;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Hidden list state */
        .hidden {
            display: none !important;
        }

        .list-container {
            border-top: 2px solid var(--border-color);
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            animation: fadeIn 0.3s ease;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            border-bottom: 1px solid var(--border-color);
            gap: 10px;
        }

        li:last-child {
            border-bottom: none;
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }

        .completed .task-text {
            text-decoration: line-through;
            color: #a0aec0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .delete-btn:hover {
            background-color: #fff5f5;
        }

        .empty-state {
            text-align: center;
            color: #a0aec0;
            padding: 1rem 0;
            font-style: italic;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h1>Todo App</h1>
        
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off">
            <button class="add-btn" id="add-button">Add</button>
        </div>

        <!-- Clickable "My Tasks" button -->
        <button class="tasks-toggle-btn" id="toggle-tasks-btn">
            My Tasks (<span id="task-count">0</span>) ▾
        </button>

        <!-- Container containing the list that opens up -->
        <div id="list-wrapper" class="list-container hidden">
            <ul id="todo-list"></ul>
            <div id="empty-msg" class="empty-state">No tasks available.</div>
        </div>
    </div>

    <script>
        const todoInput = document.getElementById('todo-input');
        const addButton = document.getElementById('add-button');
        const toggleTasksBtn = document.getElementById('toggle-tasks-btn');
        const taskCountSpan = document.getElementById('task-count');
        const listWrapper = document.getElementById('list-wrapper');
        const todoList = document.getElementById('todo-list');
        const emptyMsg = document.getElementById('empty-msg');

        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        function renderTasks() {
            todoList.innerHTML = '';
            
            if (tasks.length === 0) {
                emptyMsg.classList.remove('hidden');
            } else {
                emptyMsg.classList.add('hidden');
                tasks.forEach((task, index) => {
                    const li = document.createElement('li');
                    if (task.completed) li.classList.add('completed');

                    li.innerHTML = `
                        <span class="task-text" onclick="toggleTask(${index})">${task.text}</span>
                        <button class="delete-btn" onclick="deleteTask(${index})">✕</button>
                    `;
                    todoList.appendChild(li);
                });
            }
            
            taskCountSpan.textContent = tasks.length;
            saveTasks();
        }

        function addTask() {
            const taskText = todoInput.value.trim();
            if (taskText === '') return;

            tasks.push({ text: taskText, completed: false });
            todoInput.value = '';
            renderTasks();
        }

        // Toggles the list drop-down view open or closed
        function toggleListView() {
            listWrapper.classList.toggle('hidden');
            
            // Adjusting arrow symbol dynamically
            if (listWrapper.classList.contains('hidden')) {
                toggleTasksBtn.innerHTML = `My Tasks (<span id="task-count">${tasks.length}</span>) ▾`;
            } else {
                toggleTasksBtn.innerHTML = `My Tasks (<span id="task-count">${tasks.length}</span>) ▴`;
            }
            
            // Re-sync badge count
            document.getElementById('task-count').textContent = tasks.length;
        }

        window.toggleTask = function(index) {
            tasks[index].completed = !tasks[index].completed;
            renderTasks();
        };

        window.deleteTask = function(index) {
            tasks.splice(index, 1);
            renderTasks();
        };

        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        addButton.addEventListener('click', addTask);
        todoInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTask();
        });
        
        // Listener to open the dropdown
        toggleTasksBtn.addEventListener('click', toggleListView);

        renderTasks();
    </script>
</body>
</html>
